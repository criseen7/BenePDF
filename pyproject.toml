[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bene"
version = "0.1.0"
description = "Bene PDF: editor de PDF de escritorio, local y sin servicios externos"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "criseen7" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.12,<6.13",
    "pymupdf>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.9",
    "mypy>=1.13",
]
build = [
    "pyinstaller>=6.11",
]

[project.scripts]
bene = "bene.main:main"

[project.urls]
Repository = "https://github.com/criseen7/BenePDF"
Issues = "https://github.com/criseen7/BenePDF/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bene = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ contiene ejemplos en bloques de código; no es código del proyecto.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["bene", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Las pruebas lentas se ejecutan aparte con `pytest -m slow`.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
qt_api = "pyside6"
markers = [
    "ui: pruebas que requieren Qt (se ejecutan con QT_QPA_PLATFORM=offscreen)",
    "slow: pruebas lentas o de rendimiento",
]

[tool.coverage.run]
source = ["bene"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
