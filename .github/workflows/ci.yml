name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  calidad:
    name: Calidad (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Dependencias de Qt en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Instalar el proyecto
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tipado
        run: mypy

      - name: Pruebas
        if: runner.os != 'Windows'
        run: pytest

      - name: Pruebas y cobertura
        if: runner.os == 'Windows'
        run: pytest --cov=bene --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-windows
          path: coverage.xml
          if-no-files-found: error

  lento:
    name: Pruebas lentas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar el proyecto
        run: python -m pip install -e ".[dev]"

      - name: Documentos grandes
        run: pytest -m slow

  empaquetado:
    name: Empaquetado (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar el proyecto y PyInstaller
        run: python -m pip install -e ".[dev,build]"

      - name: Construir el ejecutable
        run: python scripts/build_app.py

      - name: Comprobar el ejecutable y las fuentes
        shell: pwsh
        run: |
          $font = "dist\BenePDF\_internal\bene\assets\fonts\LiberationSans-Regular.ttf"
          if (-not (Test-Path $font)) { throw "Falta la fuente empaquetada: $font" }
          $process = Start-Process -FilePath "dist\BenePDF\BenePDF.exe" `
            -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El ejecutable terminó con el código $($process.ExitCode)"
          }

      - name: Publicar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: BenePDF-windows
          path: dist/BenePDF
          if-no-files-found: error
